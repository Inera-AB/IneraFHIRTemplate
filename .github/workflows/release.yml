name: Publish release

# Publishes a release with IG Publisher's publication mode. A release tag
# (no "v" prefix: 1.2.0, 1.2.0-rc1) publishes to fhir.inera.se; a manual run
# on a branch publishes to the test web root. The workflow itself lives in
# Inera-AB/fhir-ig-workflows.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: Inera-AB/fhir-ig-workflows/.github/workflows/release.yml@v1
    # The template is published on fhir.inera.se as an example but kept out
    # of the FHIR package registry. An IG made from the template removes
    # these two lines so that its packages reach packages.fhir.org.
    with:
      package-feed: false
    secrets: inherit
